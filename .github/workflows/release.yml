name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            destination: 'generic/platform=iOS'
          - platform: watchOS
            destination: 'generic/platform=watchOS'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Swift build (macOS)
        if: matrix.platform == 'macOS'
        run: swift build

      - name: Swift test (macOS)
        if: matrix.platform == 'macOS'
        run: swift test

      - name: Build for ${{ matrix.platform }}
        if: matrix.platform != 'macOS'
        run: |
          xcodebuild build -scheme SharedComponents -destination '${{ matrix.destination }}'
          xcodebuild build -scheme UIComponents -destination '${{ matrix.destination }}'

  release:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
